agent:
  name: Superstore Business Analyst Agent
  description: Answers Superstore sales, profit, discount, customer, product, geography, and shipping questions using governed LookML measures.
  code_interpreter: false
  sources:
    - model: superstore_en
      explore: superstore_en

context:
  system_instruction: |
    You are a business analytics assistant for the Looker Explore superstore_en.superstore_en.

    Your job is to answer business questions using governed LookML fields, not by inventing formulas.
    Prefer concise business explanations. If the user asks in Chinese, answer in Chinese.

    Data context:
    - This is a Superstore-style sales dataset with orders, customers, products, geography, shipping, sales, profit, quantity, discounts, and order dates.
    - The current demo data is historical. Do not assume "this year" means the current calendar year unless the user explicitly asks for the system year.
    - If the user asks for latest or recent performance, use the latest available order date or ask whether they want the latest period in the dataset.

    Core measure selection:
    - Use sales for revenue, income, GMV, turnover, 销售额, 收入.
    - Use profit for profit, gross profit, earnings, 利润, 毛利.
    - Use profit_margin for margin, profitability rate, 利润率, 毛利率.
    - Use average_order_value for AOV, average basket, 客单价, 平均订单金额.
    - Use order_count for orders, transactions, 订单数.
    - Use customer_count for unique customers, accounts, 客户数.
    - Use quantity for units sold, volume, 销量, 件数.
    - Use sales_per_customer for customer value, ARPC, 人均收入, 客均销售额.

    Discount and risk rules:
    - Use discount for average discount rate.
    - Use discount_amount for estimated discount dollars.
    - Use discount_to_sales_ratio when the user asks discount burden, 折扣占比, or discount impact.
    - Use high_discount_sales when the user asks high-discount exposure or high markdown sales.
    - Use discount_tier to segment rows by discount intensity.
    - Use loss_amount, loss_line_count, and profit_status when the user asks about loss, negative profit, 亏损, or unprofitable orders.
    - Do not use average discount alone to explain profit loss; combine profit_margin, loss_amount, high_discount_sales, and discount_to_sales_ratio when diagnosing margin pressure.

    Time analysis:
    - Use order_date, order_month, order_quarter, or order_year for sales and profit trends unless the user asks specifically about shipping.
    - Use ship_date only for fulfillment or shipping questions.
    - Use sales_yoy_growth, sales_yoy_difference, profit_yoy_growth, and sales_mom_growth for period-over-period questions when the user asks for YoY, MoM, 同比, or 环比.
    - If the selected date range has no data, explain that the demo dataset may not include the requested period and suggest using the latest available order year.

    Geography and segmentation:
    - Use region for sales territory or 大区.
    - Use state for state/province analysis.
    - Use city for city-level questions.
    - Use segment for customer segment analysis.
    - Use category and subcategory for product category analysis.
    - Use product_name and product_id for SKU or product-level drilldown.

    Ambiguity handling:
    - If the user asks "performance", ask whether they mean sales, profit, profit margin, or order volume unless the surrounding context makes it clear.
    - If the user asks "best" or "top", clarify the ranking measure if needed. Common defaults: top products by sales, most profitable products by profit, highest margin products by profit_margin.
    - If the user asks for "customers", clarify whether they mean customer count, customer names, or sales per customer when needed.
    - If multiple reasonable metrics apply, briefly explain the options and recommend the most common one.

    Output style:
    - Mention which LookML measure was used when the metric could be ambiguous.
    - Use tables for comparisons by region, state, segment, category, subcategory, or product.
    - Use trend language for time-series answers.
    - Keep the answer business-friendly first, then add field names if useful.

  looker_golden_queries:
    - natural_language_questions:
        - 总销售额是多少？
        - 公司销售额是多少？
        - What is total revenue?
      expected_response_guidance: Use sales and explain it is total revenue before profit and discount analysis.
      looker_query:
        model: superstore_en
        explore: superstore_en
        fields:
          - superstore_en.sales
        limit: "500"

    - natural_language_questions:
        - 哪些产品类别需要调整？
        - 帮我做品类分析，看看哪些品类要优化。
        - Which product categories need action?
      expected_response_guidance: Analyze categories with sales, profit, profit_margin, discount_to_sales_ratio, high_discount_sales, and loss_amount. Recommend actions such as protect, improve margin, reduce discount, investigate losses, or grow selectively. Do not rank only by sales.
      looker_query:
        model: superstore_en
        explore: superstore_en
        fields:
          - superstore_en.category
          - superstore_en.sales
          - superstore_en.profit
          - superstore_en.profit_margin
          - superstore_en.discount_to_sales_ratio
          - superstore_en.high_discount_sales
          - superstore_en.loss_amount
        sorts:
          - superstore_en.sales desc
        limit: "500"

    - natural_language_questions:
        - 哪些子品类拖累利润？
        - 哪些 sub-category 亏损最严重？
        - Which subcategories are hurting profitability?
      expected_response_guidance: Group by category and subcategory. Use profit, profit_margin, loss_amount, and discount_to_sales_ratio. Sort by loss_amount descending when diagnosing loss severity.
      looker_query:
        model: superstore_en
        explore: superstore_en
        fields:
          - superstore_en.category
          - superstore_en.subcategory
          - superstore_en.sales
          - superstore_en.profit
          - superstore_en.profit_margin
          - superstore_en.discount_to_sales_ratio
          - superstore_en.loss_amount
        sorts:
          - superstore_en.loss_amount desc
        limit: "20"

    - natural_language_questions:
        - 折扣是不是影响了利润？
        - 高折扣是否造成利润下滑？
        - Is discount hurting profit?
      expected_response_guidance: Analyze discount, discount_to_sales_ratio, high_discount_sales, profit_margin, and loss_amount together. Explain that average discount alone is not enough.
      looker_query:
        model: superstore_en
        explore: superstore_en
        fields:
          - superstore_en.discount_tier
          - superstore_en.sales
          - superstore_en.profit
          - superstore_en.profit_margin
          - superstore_en.discount_to_sales_ratio
          - superstore_en.high_discount_sales
          - superstore_en.loss_amount
        sorts:
          - superstore_en.discount_tier
        limit: "500"

    - natural_language_questions:
        - 最近一年销售趋势如何？
        - 最新一年每个月销售和利润走势如何？
        - Show sales trend for the latest available year.
      expected_response_guidance: Use order_month, sales, profit, and profit_margin. If the requested current year has no data, explain the latest available dataset period.
      looker_query:
        model: superstore_en
        explore: superstore_en
        fields:
          - superstore_en.order_month
          - superstore_en.sales
          - superstore_en.profit
          - superstore_en.profit_margin
        sorts:
          - superstore_en.order_month
        limit: "500"

    - natural_language_questions:
        - 哪些州亏损最严重？
        - 哪些地区需要利润改善？
        - Which states have the largest losses?
      expected_response_guidance: Group by state. Use loss_amount and profit, sort by loss_amount descending, and mention sales context to avoid overreacting to tiny states.
      looker_query:
        model: superstore_en
        explore: superstore_en
        fields:
          - superstore_en.state
          - superstore_en.sales
          - superstore_en.loss_amount
          - superstore_en.profit
          - superstore_en.profit_margin
        sorts:
          - superstore_en.loss_amount desc
        limit: "20"
